name: Deploy qrLinkShare to GitHub Pages

# The page on GitHub Pages talks to the live server, deployed separately on Render
# with render.yaml (https://qrlinkshare-digitalmarket.onrender.com). To use another
# server, set the repository variable VITE_SERVER_URL:
# Settings → Secrets and variables → Actions → Variables.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and test
        run: |
          npm run lint
          npm test

      - name: Build the page
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL || 'https://qrlinkshare-digitalmarket.onrender.com' }}
        run: |
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
