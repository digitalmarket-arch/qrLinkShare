<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>qrLinkShare: send files between phone and computer</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="qrLinkShare" />
    <meta
      name="description"
      content="Send links, photos, PDFs, documents and notes between your phone and computer, directly from device to device. Nothing is stored on any server. Pair with a QR code or PIN, or sign in with Google or a Web3 wallet."
    />
    <meta property="og:title" content="qrLinkShare: phone ⇄ computer, instantly" />
    <meta
      property="og:description"
      content="Scan a QR code and send anything straight to your other device. No app, no cable, no server."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f5f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f3ff0'/%3E%3Cpath d='M8 8h7v7H8zM17 17h7v7h-7zM19 8h5v5h-5zM8 19h5v5H8z' fill='white'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved / system theme before first paint (avoids a white flash).
      try {
        var t = JSON.parse(localStorage.getItem('qrls.pref.theme') || '"system"');
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
